# ==============================================================================
# 第一步：配置提供商 / 渠道 (Providers & Credentials)
# 集中管理厂商的 Endpoint、API Key、请求头和限速规则
# ==============================================================================
providers:
  # ---------------- 阿里云百炼 / DashScope ----------------
  - id: aliyun
    name: "Aliyun DashScope"
    provider_type: openai_compatible  # 兼容 OpenAI 格式协议
    api_base: https://llm-mx4s0w2f2aowaq5u.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key: "${ALIYUN_API_KEY}"
    rpm: 1000
    tpm: 100000

  # ---------------- Anthropic 官方 ----------------
  - id: provider-anthropic
    name: "Anthropic Main"
    provider_type: anthropic
    api_base: https://api.anthropic.com/v1
    api_key: "${ANTHROPIC_API_KEY:sk-default-key}"

  # ---------------- 本地私有化部署 (vLLM) ----------------
  - id: local
    name: "Internal vLLM Cluster"
    provider_type: openai_compatible
    api_base: http://121.4.44.127:6080/compatible-mode/v1
    api_key: "${LOCAL_API_KEY}"


# ==============================================================================
# 第二步：选择与映射模型 (Models & Routing Setup)
# 将物理模型绑定到指定的 Provider，并暴露统一的“逻辑模型别名”给业务侧
# ==============================================================================
models:
  # ---------------- 逻辑分组：default (主力模型) ----------------
  default:
    provider_id: local
    model_name: deepseek-v4.1-flash

  # ---------------- 逻辑分组：flash (极速/开源/低成本模型) ----------------
  flash:
    provider_id: local
    model_name: deepseek-v4.1-flash
  # ---------------- 逻辑分组：object (结构化输出模型) ----------------
  object:
    provider_id: local
    model_name: qwen3.8-flash

