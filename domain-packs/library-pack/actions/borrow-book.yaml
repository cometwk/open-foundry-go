action: BorrowBook
version: 1
reversible: false

preconditions:
  - expr: "book.availableCopies > 0"
    error: "That book is not available to borrow"
  - expr: "actor.hasRole('librarian') || actor.hasRole('admin')"
    error: "Only librarians may lend books"

effects:
  - type: updateObject
    target: "book"
    set:
      availableCopies: "book.availableCopies - 1"

  - type: updateObject
    target: "reader"
    set:
      currentBorrowCount: "reader.currentBorrowCount + 1"

  - type: createLink
    linkType: "Borrows"
    from: "reader"
    to: "book"

sideEffects:
  - name: emitBorrowedEvent
    type: event
    config:
      type: "example.library.book.borrowed"
      data:
        bookId: "book.id"
        readerId: "reader.id"

rollback:
  onSideEffectFailure: ROLLBACK_ALL
