action: ReturnBook
version: 1
reversible: false

preconditions:
  - expr: "book.availableCopies < book.totalCopies"
    error: "That book is not currently on loan"
  - expr: "actor.hasRole('librarian') || actor.hasRole('admin')"
    error: "Only librarians may accept returns"

effects:
  - type: updateObject
    target: "book"
    set:
      availableCopies: "book.availableCopies + 1"

  - type: updateObject
    target: "reader"
    set:
      currentBorrowCount: "reader.currentBorrowCount - 1"

  - type: deleteLink
    linkType: "Borrows"
    filter:
      from: "reader"
      to: "book"
      active: true
    expect: ALL

rollback:
  onSideEffectFailure: ROLLBACK_ALL
