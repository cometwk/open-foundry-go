# List seed rows. IDs are Engine-minted UUIDv7, not yaml refs.
# Posted as {"query": <this file>} — same shape as runtime/e2e gql().

{
  books {
    edges {
      node {
        id
        isbn
        title
      }
    }
  }
  readers {
    edges {
      node {
        id
        membershipLevel
        currentBorrowCount
        name
      }
    }
  }
  branches {
    edges {
      node {
        id
        name
        maxBorrowPerReader
      }
    }
  }
}
