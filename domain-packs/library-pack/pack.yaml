# Library Domain Pack — 6 types / 10 relations.
#
# pack.yaml loads the full ontology (one ODL definition).
# seeds/simple.yaml is the 3-type / 3-relation projection for unit tests.
# seeds/demo.yaml is the full graph for human testing.
name: library
version: 0.1.0
namespace: example.library
description: "Library lending case — Reader/Book/Branch core with Author/Category/Series"

dependencies:
  openfoundry.core: ">=1.0.0"

provides:
  objectTypes: 6
  linkTypes: 10
  actionTypes: 2
  functions: 0
  connectors: 0
  widgets: 0
  qualityRules: 0

schema:
  - schema/enums.odl
  - schema/reader.odl
  - schema/book.odl
  - schema/branch.odl
  - schema/author.odl
  - schema/category.odl
  - schema/series.odl
  - schema/links.odl
  - schema/actions.odl

actions:
  - actions/borrow-book.yaml
  - actions/return-book.yaml

obda:
  - obda/library.obda.yaml

# Only .fga files are listed here. permissions/field-permissions.yaml is
# discovered by convention if present. Not in scope this round.
permissions:
  - permissions/library-roles.fga

seed:
  - seeds/simple.yaml
