# Library Domain Pack — OBDA mapping
#
# BorrowedBy is a junction table (has borrowedAt/dueAt).
# OwnedBy is a host FK on book (property-less). SQLite refuses inline.

apiVersion: openfoundry.io/obda/v1
kind: OBDAConfig
metadata:
  name: library
  namespace: example.library
  version: 1
schema:
  namespace: example.library
  version: 1
models:
  Book:
    relation:
      kind: table
      name: book
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      isbn:
        column: isbn
      title:
        column: title
      author:
        column: author
      status:
        column: status
  Member:
    relation:
      kind: table
      name: member
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      memberNumber:
        column: member_number
      name:
        column: name
      email:
        column: email
# BorrowedBy keeps kind: table because it carries borrowedAt/dueAt.
# OwnedBy is property-less and defaults to an inline FK on book.
links:
  BorrowedBy:
    relation:
      kind: table
      name: borrowed_by
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    from:
      object: Book
      columns: [from_id]
    to:
      object: Member
      columns: [to_id]
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      borrowedAt:
        column: borrowed_at
      dueAt:
        column: due_at
  OwnedBy:
    relation: {kind: inline}
    access: readWrite
    from: {object: Book}
    to: {object: Member, columns: [owner_id]}
