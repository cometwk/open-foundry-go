# Simplified library-pack case: Reader / Book / Branch with the two
# junction-table links Borrows (Reader→Book) and AvailableAt (Book→Branch).
# RegisteredAt is covered separately by library_inline.obda.yaml (简化版).
apiVersion: openfoundry.io/obda/v1
kind: OBDAConfig
metadata:
  name: library-links
  namespace: example.library
  version: 1
schema:
  namespace: example.library
  version: 1
models:
  Reader:
    relation:
      kind: table
      name: reader
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      name:
        column: name
  Book:
    relation:
      kind: table
      name: book
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      title:
        column: title
  Branch:
    relation:
      kind: table
      name: branch
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      name:
        column: name
links:
  Borrows:
    relation:
      kind: table
      name: borrows
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    from:
      object: Reader
      columns: [from_id]
    to:
      object: Book
      columns: [to_id]
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
  AvailableAt:
    relation:
      kind: table
      name: available_at
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    from:
      object: Book
      columns: [from_id]
    to:
      object: Branch
      columns: [to_id]
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
