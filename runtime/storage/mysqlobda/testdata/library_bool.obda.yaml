# Simplified library-pack case: Branch carries the Boolean field
# allowInterLibraryLoan (简化版).
apiVersion: openfoundry.io/obda/v1
kind: OBDAConfig
metadata:
  name: library-bool
  namespace: example.library
  version: 1
schema:
  namespace: example.library
  version: 1
models:
  Branch:
    relation:
      kind: table
      name: branch
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      name:
        column: name
      allowInterLibraryLoan:
        column: allow_inter_library_loan
