apiVersion: openfoundry.io/obda/v1
kind: OBDAConfig
metadata:
  name: hospital
  namespace: nhs.acute
  version: 1
schema:
  namespace: nhs.acute
  version: 1
models:
  Patient:
    relation:
      kind: table
      name: patient
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      name:
        column: patient_name
  Ward:
    relation:
      kind: table
      name: ward
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      name:
        column: ward_name
  Trust:
    relation:
      kind: table
      name: trust
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      name:
        column: trust_name
links:
  AdmittedTo:
    relation:
      kind: table
      name: admission
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    from:
      object: Patient
      columns: [from_id]
    to:
      object: Ward
      columns: [to_id]
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
  BelongsTo:
    relation:
      kind: table
      name: ward_trust
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    from:
      object: Ward
      columns: [from_id]
    to:
      object: Trust
      columns: [to_id]
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
