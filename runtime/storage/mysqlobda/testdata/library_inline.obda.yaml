# Simplified library-pack case: RegisteredAt (Reader→Branch, MANY_TO_ONE)
# mapped as a host-table FK on reader.branch_id, mirroring the pack OBDA
# (简化版). SQLite refuses inline; MySQL hosts it.
apiVersion: openfoundry.io/obda/v1
kind: OBDAConfig
metadata:
  name: library-inline
  namespace: example.library
  version: 1
schema:
  namespace: example.library
  version: 1
models:
  Reader:
    relation: {kind: table, name: reader}
    access: readWrite
    identity: {strategy: direct, columns: [id], insert: generated}
    tenant: {strategy: column, column: tenant_id}
    system: {strategy: native}
    fields:
      name: {column: name}
  Branch:
    relation: {kind: table, name: branch}
    access: readWrite
    identity: {strategy: direct, columns: [id], insert: generated}
    tenant: {strategy: column, column: tenant_id}
    system: {strategy: native}
    fields:
      name: {column: name}
links:
  RegisteredAt:
    relation: {kind: inline}
    access: readWrite
    from: {object: Reader}
    to: {object: Branch, columns: [branch_id]}
