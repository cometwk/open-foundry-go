# Simplified library-pack case: Book with a single-field FULLTEXT contract
# (title only) for schema-drift verification (简化版).
apiVersion: openfoundry.io/obda/v1
kind: OBDAConfig
metadata:
  name: library-search
  namespace: example.library
  version: 1
schema:
  namespace: example.library
  version: 1
models:
  Book:
    relation:
      kind: table
      name: book
    access: readWrite
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    search:
      fields: [title]
    fields:
      title:
        column: title
