# Simplified library-pack case: Reader mapped read-only (简化版).
apiVersion: openfoundry.io/obda/v1
kind: OBDAConfig
metadata:
  name: library-read
  namespace: example.library
  version: 1
schema:
  namespace: example.library
  version: 1
models:
  Reader:
    relation:
      kind: table
      name: reader
    access: read
    identity:
      strategy: direct
      columns: [id]
      insert: generated
    tenant:
      strategy: column
      column: tenant_id
    system:
      strategy: native
    fields:
      name:
        column: name
